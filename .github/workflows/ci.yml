name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: npm ci && npm run build
      - run: cargo check -p auction-helper --locked
